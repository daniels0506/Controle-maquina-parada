<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Paradas de Máquinas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            industrial: {
              800: '#1e293b',
              900: '#0f172a'
            }
          }
        }
      }
    }
  </script>
  <!-- Firebase SDKs (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ MANTÉM OS TEUS DADOS REAIS DO FIREBASE AQUI EM BAIXO:
    const firebaseConfig = {
      apiKey: "AIzaSyCWDJ1xv4eEjFLNnuoPON3IZR...",
      authDomain: "monitor-paradas.firebaseapp.com",
      projectId: "monitor-paradas",
      storageBucket: "monitor-paradas.firebasestorage.app",
      messagingSenderId: "1076661275135",
      appId: "1:1076661275135:web:1f57688267a4..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MACHINES = ["EPSON", "VANGUARD", "AGFA", "P5", "LIYU"];
    let activeDowntimes = {};
    let historyRecords = [];
    // Controla quais máquinas já dispararam o alarme neste dispositivo para não repetir infinito
    let alertedMachines = {};

    // Sistema de Áudio (Web Audio API - funciona sem ficheiros mp3 externos)
    let audioCtx = null;
    window.unlockAudioAndNotifications = async function() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      if ("Notification" in window && Notification.permission !== "granted") {
        await Notification.requestPermission();
      }
      updateAlertButtonStatus();
      playAlarmBeep(); // Toca um bipe curto de teste para confirmar
    };

    function playAlarmBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // Toca 3 bipes rápidos de alerta
        [0, 0.25, 0.5].forEach(delay => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay); // Nota Lá agudo
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + 0.18);
        });
      } catch (e) {
        console.log("Áudio bloqueado pelo navegador até interação:", e);
      }
    }

    function triggerSystemAlert(machine, reason) {
      // 1. Vibração no telemóvel Android
      if ("vibrate" in navigator) {
        navigator.vibrate([500, 200, 500, 200, 800]);
      }

      // 2. Som de alarme
      playAlarmBeep();

      // 3. Notificação Push na barra superior do Android
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`⏰ TEMPO ESGOTADO: ${machine}`, {
          body: `A parada (${reason}) atingiu o tempo previsto! Finalize no sistema.`,
          tag: `alert-${machine}`,
          requireInteraction: true
        });
      }
    }

    function updateAlertButtonStatus() {
      const btn = document.getElementById('enableAlertsBtn');
      if (!btn) return;
      if ("Notification" in window && Notification.permission === "granted") {
        btn.innerHTML = '🔔 Alertas Ativos';
        btn.className = 'px-3 py-1.5 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-400 text-xs font-medium cursor-pointer';
      } else {
        btn.innerHTML = '🔕 Ativar Alertas';
        btn.className = 'px-3 py-1.5 rounded-full bg-amber-500/20 border border-amber-500/50 text-amber-300 text-xs font-bold animate-bounce cursor-pointer';
      }
    }

    function initRealtimeSync() {
      onSnapshot(collection(db, "active_downtimes"), (snapshot) => {
        activeDowntimes = {};
        snapshot.forEach((docSnap) => {
          activeDowntimes[docSnap.id] = { firebaseDocId: docSnap.id, ...docSnap.data() };
        });

        // Limpa controlo de alerta se a máquina já voltou a trabalhar
        Object.keys(alertedMachines).forEach(m => {
          if (!activeDowntimes[m]) delete alertedMachines[m];
        });

        renderUI();
      });

      const q = query(collection(db, "history_records"), orderBy("startTimestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        historyRecords = [];
        snapshot.forEach((docSnap) => {
          historyRecords.push({ firebaseDocId: docSnap.id, ...docSnap.data() });
        });
        renderUI();
      });
    }

    window.setPresetMinutes = function(mins) {
      document.getElementById('limitMinutesInput').value = mins;
    };

    window.renderUI = function() {
      const grid = document.getElementById('machinesGrid');
      if (!grid) return;
      grid.innerHTML = '';

      MACHINES.forEach(mach => {
        const active = activeDowntimes[mach];
        const isStopped = !!active;

        // Verifica se tem limite e se já estourou
        let isOverdue = false;
        if (isStopped && active.limitTimestamp) {
          isOverdue = Date.now() >= active.limitTimestamp;
        }

        const card = document.createElement('div');
        card.id = `card-${mach}`;
        card.className = `rounded-xl border p-4 shadow-sm flex flex-col justify-between transition-colors ${
          isOverdue
            ? 'bg-amber-950/50 border-amber-500 animate-pulse'
            : isStopped
              ? 'bg-red-950/30 border-red-500/80'
              : 'bg-slate-800 border-slate-700'
        }`;

        let html = `
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
              <h3 class="font-bold text-white text-base">${mach}</h3>
              <span id="badge-${mach}" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                isOverdue
                  ? 'bg-amber-500/20 text-amber-300 border border-amber-500/60'
                  : isStopped
                    ? 'bg-red-500/20 text-red-400 border border-red-500/40'
                    : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
              }">
                ${isOverdue ? '⏰ TEMPO ESGOTADO' : isStopped ? '🔴 EM PARADA' : '🟢 OPERACIONAL'}
              </span>
            </div>
        `;

        if (isStopped) {
          html += `
            <div class="space-y-1 text-xs">
              <p><strong class="text-slate-400">Motivo:</strong> ${active.reason}</p>
              ${active.observation ? `<p><strong class="text-slate-400">Obs:</strong> ${active.observation}</p>` : ''}
              <p><strong class="text-slate-400">Início:</strong> ${new Date(active.startTimestamp).toLocaleTimeString()}</p>
              ${active.limitMinutes ? `<p><strong class="text-slate-400">Previsão:</strong> ${active.limitMinutes} min (até ${new Date(active.limitTimestamp).toLocaleTimeString()})</p>` : ''}
              
              <div class="bg-slate-900/90 border ${isOverdue ? 'border-amber-500/80' : 'border-red-500/50'} rounded-lg p-3 text-center mt-2 space-y-1">
                <span class="text-[10px] text-slate-400 block uppercase">Tempo Total Parada</span>
                <div class="text-2xl font-mono font-bold ${isOverdue ? 'text-amber-400' : 'text-red-400'} timer-display"
                     data-machine="${mach}"
                     data-reason="${active.reason}"
                     data-start="${active.startTimestamp}"
                     data-limit="${active.limitTimestamp || ''}">00:00:00</div>
                ${active.limitTimestamp ? `<div id="countdown-${mach}" class="text-xs font-mono font-semibold text-sky-400">Calculando...</div>` : ''}
              </div>
            </div>

            <button type="button" onclick="window.handleEndDowntime('${mach}')"
              class="w-full mt-3 py-3 px-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-lg flex items-center justify-center gap-2 cursor-pointer">
              ✅ FINALIZAR & AVISAR WHATSAPP
            </button>
          `;
        } else {
          html += `
            <div class="py-6 text-center text-slate-400 text-xs">
              ✅ Máquina em plena produção
            </div>
          `;
        }

        html += `</div>`;
        card.innerHTML = html
