<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Paradas - Sincronizado</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            industrial: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-industrial-900 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <!-- Toast / Notificação -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Cabeçalho -->
  <header class="bg-industrial-800 border-b border-slate-700/60 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-sky-500/10 border border-sky-500/30 rounded-lg text-sky-400">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Monitor de Paradas
            <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">Chão de Fábrica</span>
          </h1>
          <p class="text-xs text-slate-400">Sincronizado entre Telemóveis</p>
        </div>
      </div>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Online (Nuvem)</span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- ESTATÍSTICAS / KPIs -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-industrial-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
        <span class="text-xs text-slate-400">Total de Máquinas</span>
        <div class="text-2xl font-bold text-white">5</div>
      </div>
      <div class="bg-industrial-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
        <span class="text-xs text-emerald-400">Em Produção</span>
        <div id="statOperating" class="text-2xl font-bold text-emerald-400">5</div>
      </div>
      <div class="bg-industrial-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
        <span class="text-xs text-red-400">Em Parada</span>
        <div id="statStopped" class="text-2xl font-bold text-red-400">0</div>
      </div>
      <div class="bg-industrial-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
        <span class="text-xs text-sky-400">Paradas Hoje</span>
        <div id="statTodayCount" class="text-2xl font-bold text-sky-400">0</div>
      </div>
    </section>

    <!-- STATUS DAS MÁQUINAS -->
    <section class="space-y-4">
      <h2 class="text-base sm:text-lg font-semibold text-slate-200 flex items-center gap-2">
        <i data-lucide="layout-grid" class="w-5 h-5 text-sky-400"></i>
        Status das Máquinas (Multi-Dispositivo)
      </h2>
      <div id="machinesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- FORMULÁRIO DE REGISTAR PARADA -->
    <section class="bg-industrial-800 border border-slate-700 rounded-xl p-5 shadow-md">
      <div class="flex items-center gap-2.5 pb-4 mb-4 border-b border-slate-700">
        <div class="p-2 bg-red-500/10 text-red-400 rounded-lg">
          <i data-lucide="play-circle" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-100 text-base">Registrar Nova Parada</h3>
          <p class="text-xs text-slate-400">Ao iniciar, todos os telemóveis verão o cronômetro em tempo real</p>
        </div>
      </div>

      <form id="startStopForm" class="space-y-4" onsubmit="handleStartDowntime(event)">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Selecione a Máquina *</label>
            <select id="machineSelect" required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="" disabled selected>Escolha uma máquina...</option>
              <option value="EPSON">EPSON</option>
              <option value="VANGUARD">VANGUARD</option>
              <option value="AGFA">AGFA</option>
              <option value="P5">P5</option>
              <option value="LIYU">LIYU</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1.5">Motivo da Parada *</label>
            <select id="reasonSelect" required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="" disabled selected>Escolha o motivo...</option>
              <option value="Troca de material">Troca de material</option>
              <option value="Preparação ou troca de serviço">Preparação ou troca de serviço</option>
              <option value="Limpeza da máquina">Limpeza da máquina</option>
              <option value="Impressão de teste">Impressão de teste</option>
              <option value="Falta de tinta ou material">Falta de tinta ou material</option>
              <option value="Aguardando arquivo ou aprovação">Aguardando arquivo ou aprovação</option>
              <option value="Falha técnica ou alarme">Falha técnica ou alarme</option>
              <option value="Manutenção programada">Manutenção programada</option>
              <option value="Crash da máquina">Crash da máquina</option>
              <option value="Colocar/retirar skins">Colocar/retirar skins</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Observação (Opcional)</label>
          <textarea id="observationInput" rows="2" placeholder="Detalhes adicionais..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500 resize-none"></textarea>
        </div>
        <div class="flex justify-end">
          <button type="submit"
            class="w-full sm:w-auto px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-semibold text-sm rounded-lg shadow transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="power" class="w-4 h-4"></i> Iniciar Parada
          </button>
        </div>
      </form>
    </section>

    <!-- HISTÓRICO -->
    <section class="bg-industrial-800 border border-slate-700 rounded-xl p-5 shadow-md space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700">
        <h3 class="font-bold text-slate-100 text-base flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-sky-400"></i> Histórico de Paradas
        </h3>
        <button onclick="exportToCSV()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium flex items-center gap-1 cursor-pointer">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar CSV
        </button>
      </div>

      <div id="historyList" class="space-y-2.5"></div>
    </section>
  </main>

  <!-- SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBw0X11234567890abcdefghijklmnopqrst",
      authDomain: "controle-maquina-parada.firebaseapp.com",
      projectId: "controle-maquina-parada",
      storageBucket: "controle-maquina-parada.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:1234567890abcdef"
    };

    const MACHINES = ["EPSON", "VANGUARD", "AGFA", "P5", "LIYU"];
    let activeDowntimes = {};
    let historyRecords = [];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function initCloudSync() {
      try {
        await signInAnonymously(auth);
      } catch (e) {
        console.warn("Auth:", e);
      }

      // Sincroniza paradas ativas em tempo real
      onSnapshot(collection(db, "active_downtimes"), (snapshot) => {
        activeDowntimes = {};
        snapshot.forEach((doc) => {
          activeDowntimes[doc.id] = doc.data();
        });
        renderUI();
      });

      // Sincroniza o histórico em tempo real em todos os telemóveis
      onSnapshot(collection(db, "history_records"), (snapshot) => {
        historyRecords = [];
        snapshot.forEach((doc) => {
          historyRecords.push(doc.data());
        });
        historyRecords.sort((a, b) => b.startTimestamp - a.startTimestamp);
        renderUI();
      });
    }

    function renderUI() {
      const grid = document.getElementById('machinesGrid');
      grid.innerHTML = '';

      MACHINES.forEach(mach => {
        const active = activeDowntimes[mach];
        const isStopped = !!active;

        const card = document.createElement('div');
        card.className = `rounded-xl border p-4 shadow-sm flex flex-col justify-between ${
          isStopped ? 'bg-red-950/30 border-red-500/80 animate-pulse' : 'bg-industrial-800 border-slate-700'
        }`;

        let html = `
          <div class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
              <h3 class="font-bold text-white text-base">${mach}</h3>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                isStopped ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40'
              }">
                ${isStopped ? 'EM PARADA' : 'OPERACIONAL'}
              </span>
            </div>
        `;

        if (isStopped) {
          html += `
            <div class="space-y-1 text-xs">
              <p><strong class="text-slate-400">Motivo:</strong> ${active.reason}</p>
              ${active.observation ? `<p><strong class="text-slate-400">Obs:</strong> ${active.observation}</p>` : ''}
              <p><strong class="text-slate-400">Início:</strong> ${new Date(active.startTimestamp).toLocaleTimeString()}</p>
              
              <div class="bg-slate-900/90 border border-red-500/50 rounded-lg p-3 text-center mt-2">
                <span class="text-[10px] text-slate-400 block uppercase">Tempo Decorrido</span>
                <div class="text-2xl font-mono font-bold text-red-400 timer-display" data-start="${active.startTimestamp}">00:00:00</div>
              </div>
            </div>

            <button type="button" data-machine="${mach}" class="btn-end-stop w-full mt-3 py-3 px-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-lg flex items-center justify-center gap-2 cursor-pointer">
              <i data-lucide="check-circle" class="w-4 h-4"></i> FINALIZAR / ENCERRAR PARADA
            </button>
          `;
        } else {
          html += `
            <div class="py-6 text-center text-slate-400 text-xs">
              <i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-500/50 mx-auto mb-1"></i>
              Máquina em plena produção
            </div>
          `;
        }

        html += `</div>`;
        card.innerHTML = html;
        grid.appendChild(card);
      });

      // Atribuição direta do evento de clique com suporte otimizado a toque em telemóveis
      document.querySelectorAll('.btn-end-stop').forEach(button => {
        button.addEventListener('click', async function(e) {
          e.preventDefault();
          const machName = this.getAttribute('data-machine');
          await executeEndDowntime(machName);
        });
      });

      // Atualiza o dropdown
      const sel = document.getElementById('machineSelect');
      for (let opt of sel.options) {
        if (opt.value) {
          opt.disabled = !!activeDowntimes[opt.value];
          opt.text = opt.disabled ? `${opt.value} (EM PARADA)` : opt.value;
        }
      }

      renderHistory();
      updateStats();
      lucide.createIcons();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      if (historyRecords.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhum registo no histórico.</p>';
        return;
      }

      historyRecords.forEach(rec => {
        const isRunning = rec.isActive;
        const duration = isRunning ? 'Em andamento...' : formatDuration(rec.endTimestamp - rec.startTimestamp);

        const item = document.createElement('div');
        item.className = 'bg-slate-900/80 border border-slate-700/70 rounded-lg p-3 text-xs space-y-1';
        item.innerHTML = `
          <div class="flex justify-between font-bold text-white">
            <span>${rec.machine} - ${rec.reason}</span>
            <span class="${isRunning ? 'text-red-400' : 'text-emerald-400'}">${isRunning ? 'ATIVA' : 'ENCERRADA'}</span>
          </div>
          <p class="text-slate-400">Início: ${new Date(rec.startTimestamp).toLocaleString()}</p>
          <p class="text-sky-400 font-mono">Duração: ${duration}</p>
          ${rec.observation ? `<p class="italic text-slate-300">"${rec.observation}"</p>` : ''}
        `;
        list.appendChild(item);
      });
    }

    window.handleStartDowntime = async function(e) {
      e.preventDefault();
      const machine = document.getElementById('machineSelect').value;
      const reason = document.getElementById('reasonSelect').value;
      const observation = document.getElementById('observationInput').value.trim();

      if (!machine || !reason) return;

      const startTimestamp = Date.now();
      const recordId = `${machine}_${startTimestamp}`;
      const record = { id: recordId, machine, reason, observation, startTimestamp, endTimestamp: null, isActive: true };

      await setDoc(doc(db, "active_downtimes", machine), record);
      await setDoc(doc(db, "history_records", recordId), record);

      document.getElementById('startStopForm').reset();
    };

    async function executeEndDowntime(machineName) {
      const active = activeDowntimes[machineName];
      if (!active) return;

      const endTimestamp = Date.now();
      
      // Atualiza o histórico na nuvem para todos os telemóveis verem
      await setDoc(doc(db, "history_records", active.id), {
        ...active,
        endTimestamp,
        isActive: false
      });

      // Remove a máquina do estado ativo para liberar o painel em todos os telemóveis
      await deleteDoc(doc(db, "active_downtimes", machineName));
    }

    function updateStats() {
      const activeCount = Object.keys(activeDowntimes).length;
      document.getElementById('statOperating').textContent = MACHINES.length - activeCount;
      document.getElementById('statStopped').textContent = activeCount;

      const todayStart = new Date().setHours(0,0,0,0);
      const todayCount = historyRecords.filter(r => r.startTimestamp >= todayStart).length;
      document.getElementById('statTodayCount').textContent = todayCount;
    }

    function updateTimers() {
      document.querySelectorAll('.timer-display').forEach(el => {
        const start = parseInt(el.getAttribute('data-start'), 10);
        const diff = Date.now() - start;
        el.textContent = formatDuration(diff);
      });
    }

    function formatDuration(ms) {
      const secs = Math.floor(ms / 1000);
      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    window.exportToCSV = function() {
      if (historyRecords.length === 0) return;
      let csv = 'Maquina;Motivo;Inicio;Fim;Status;Observacao\n';
      historyRecords.forEach(r => {
        csv += `"${r.machine}";"${r.reason}";"${new Date(r.startTimestamp).toLocaleString()}";"${r.endTimestamp ? new Date(r.endTimestamp).toLocaleString() : ''}";"${r.isActive ? 'ATIVA' : 'ENCERRADA'}";"${r.observation || ''}"\n`;
      });
      const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'historico_paradas.csv';
      link.click();
    };

    window.onload = function() {
      initCloudSync();
      setInterval(updateTimers, 1000);
    };
  </script>
</body>
</html>
